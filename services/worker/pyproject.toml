[project]
name = "global-news-digest-worker"
version = "0.1.0"
description = "Global News Digest background processing"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.6,<6",
  "datasketch>=2,<3",
  "feedparser>=6.0,<7",
  "httpx>=0.28,<1",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sentence-transformers>=6,<7",
  "sqlalchemy>=2.0.43,<3",
  "tenacity>=9,<10",
  "trafilatura>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
