name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation baseline
        shell: bash
        run: |
          test -f README.md
          test -f PROJECT_SPEC.md
          test -f docs/api.md
          test -f config/.env.example

  web-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run typecheck

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r services/api/requirements.lock datasketch ruff
      - run: ruff format --check services packages tests
      - run: ruff check services packages tests
      - run: python -m pytest
