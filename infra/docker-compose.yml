name: global-news-digest

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: global_news
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_user -d global_news"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: change_me
    ports:
      - "8080:8080"

  api:
    build:
      context: ../services/api
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://news_user:change_me@postgres:5432/global_news
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_URL: http://keycloak:8080
      PIPELINE_VERSION: v1
      LLM_MOCK_MODE: "true"
      COLLECTOR_MOCK_MODE: "true"
    volumes:
      - ../services/api:/app
    ports:
      - "8000:8000"
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://news_user:change_me@postgres:5432/global_news
      REDIS_URL: redis://redis:6379/0
      PIPELINE_VERSION: v1
      LLM_MOCK_MODE: "true"
      COLLECTOR_MOCK_MODE: "true"
    volumes:
      - ../services/worker/app:/app/app
      - ../packages:/app/packages:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=INFO

  beat:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://news_user:change_me@postgres:5432/global_news
      REDIS_URL: redis://redis:6379/0
      PIPELINE_VERSION: v1
    volumes:
      - ../services/worker/app:/app/app
      - ../packages:/app/packages:ro
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.celery_app beat --loglevel=INFO

  flower:
    image: mher/flower:2.0
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
      INTERNAL_API_BASE_URL: http://api:8000/api
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api

  test:
    profiles: [test]
    build:
      context: ../services/api
    volumes:
      - ../services/api:/app
      - ../services/worker:/app/services/worker:ro
      - ../tests:/tests:ro
      - ../packages:/app/packages:ro
    command: python -m pytest /tests
    depends_on:
      postgres:
        condition: service_healthy

  rsshub:
    profiles: [feeds]
    build:
      context: ../vendor/rsshub
    ports:
      - "1200:1200"

  miniflux:
    image: miniflux/miniflux:latest
    profiles: [feeds]
    environment:
      DATABASE_URL: postgres://news_user:change_me@postgres:5432/miniflux?sslmode=disable
      RUN_MIGRATIONS: 1
      CREATE_ADMIN: 1
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change_me
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: [observability]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  loki:
    image: grafana/loki:3.2.1
    profiles: [observability]
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

volumes:
  postgres_data:
  redis_data:
  web_node_modules:
  web_next:
  prometheus_data:
  grafana_data:
